name: Instagram gonder
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install google-api-python-client google-auth-oauthlib requests
      - name: ig_bekleyen videolarını Instagram'a gönder
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          VIDEO_URL_TABANI: https://raw.githubusercontent.com/${{ github.repository }}/main/
        run: python ig_gonder.py
      - name: Gönderilenleri depodan sil
        if: always()
        run: |
          git config user.name "paylasim-botu"
          git config user.email "bot@users.noreply.github.com"
          git add -A ig_bekleyen
          git commit -m "Instagram'a gönderildi" || echo "değişiklik yok"
          git push
