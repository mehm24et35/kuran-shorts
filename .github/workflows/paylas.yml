name: Paylas
on:
  workflow_dispatch:
  # Zamanlama GitHub'da değil, cron-job.org'da: her gün 06:00 ve 18:00 (Europe/Istanbul)
  # workflow_dispatch API'sini çağırıyor. GitHub'ın schedule tetikleyicisi 5-6 saat gecikiyordu.
permissions:
  contents: write
jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install google-api-python-client google-auth-oauthlib requests
      - name: Anahtarları yaz
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json
      - name: Sıradaki videoyu paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          VIDEO_URL_TABANI: https://raw.githubusercontent.com/${{ github.repository }}/main/
        run: python youtube_yukle.py --adet 1
      - name: Kaydı depoya yaz
        if: always()
        run: |
          git config user.name "paylasim-botu"
          git config user.email "bot@users.noreply.github.com"
          git add paylasilan.csv cikti
          git commit -m "paylaşıldı" || echo "değişiklik yok"
          git push
